name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Stage 1 - Linting & Formatting (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Stage 2 - Strict Type Checking (mypy)
        run: uv run mypy --strict .

      - name: Stage 3 - Regression Tests with Branch Coverage
        run: uv run pytest -v -m "not fuzz" --cov=src --cov-branch --cov-report=term-missing
